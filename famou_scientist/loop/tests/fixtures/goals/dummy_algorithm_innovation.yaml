  "benchmarks": [
    {
      "name": "dummy_classification_bench",
      "adapter": {
        "type": "dummy"
      },
      "official_metric": {
        "name": "accuracy",
        "direction": "higher_is_better"
      },
      "hidden_test_access": "forbidden"
