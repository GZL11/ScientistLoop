<!DOCTYPE html>
<!--
  famou-scientist 轨迹可视化前端（单文件，vanilla JS+CSS，无构建无外链）。
  由 trace_web.py 在 GET / 时返回。数据来自 /api/sessions 与 /api/trace。
  深色终端风。所有会话内容一律 textContent 注入，防 XSS。
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>famou-scientist · 轨迹观测</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#11161d; --bg3:#161b22; --line:#222b36;
    --fg:#c9d1d9; --dim:#7d8590; --accent:#58a6ff; --green:#3fb950;
    --yellow:#d29922; --red:#f85149; --purple:#bc8cff; --cyan:#39c5cf;
    --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.55 var(--mono);}
  a{color:var(--accent);text-decoration:none}
  /* 布局 */
  #app{display:grid;grid-template-columns:300px 1fr;height:100vh}
  #side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #main{display:flex;flex-direction:column;min-height:0}
  /* 侧栏 */
  #side h1{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--accent);letter-spacing:.5px}
  #side h1 small{color:var(--dim);font-weight:normal}
  #sfilter{margin:10px;padding:7px 9px;background:var(--bg3);border:1px solid var(--line);color:var(--fg);border-radius:6px;font:inherit}
  #slist{overflow:auto;flex:1;padding:0 8px 12px}
  .scard{padding:8px 10px;border:1px solid var(--line);border-radius:7px;margin:6px 0;cursor:pointer;background:var(--bg3)}
  .scard:hover{border-color:var(--accent)}
  .scard.active{border-color:var(--accent);background:#10243f}
  .scard .id{color:var(--cyan);font-size:11px;word-break:break-all}
  .scard .ti{color:var(--fg);margin:3px 0}
  .scard .meta{color:var(--dim);font-size:11px}
  .scard .child{color:var(--purple)}
  /* 顶栏 */
  #top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
  #top input[type=text]{flex:1;min-width:220px;padding:7px 10px;background:var(--bg3);border:1px solid var(--line);color:var(--fg);border-radius:6px;font:inherit}
  #top button{padding:7px 12px;background:#1f6feb;border:0;color:#fff;border-radius:6px;cursor:pointer;font:inherit}
  #top button.ghost{background:var(--bg3);border:1px solid var(--line);color:var(--fg)}
  #top button:hover{filter:brightness(1.12)}
  .toggle{color:var(--dim);display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent)}
  /* 统计条 */
  #stat{padding:7px 14px;background:var(--bg);border-bottom:1px solid var(--line);color:var(--dim);font-size:12px;display:none}
  #stat b{color:var(--fg)}
  /* 时间线 */
  #tl{overflow:auto;flex:1;padding:16px 18px 60px}
  .ev{margin:0 0 10px;max-width:980px}
  .ev .lead{color:var(--dim);font-size:11px;margin-bottom:2px}
  .bubble{padding:9px 12px;border-radius:8px;white-space:pre-wrap;word-break:break-word;border:1px solid var(--line)}
  .user .bubble{background:#10243f;border-color:#1f3a5f}
  .assistant .bubble{background:var(--bg3)}
  .role-tag{font-weight:bold}
  .user .role-tag{color:var(--accent)}
  .assistant .role-tag{color:var(--green)}
  /* 工具卡 */
  .tool{border:1px solid var(--line);border-radius:8px;background:var(--bg3);overflow:hidden}
  .tool>summary{padding:8px 11px;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tool>summary::-webkit-details-marker{display:none}
  .tool .tname{color:var(--yellow);font-weight:bold}
  .tool.skill .tname{color:var(--purple)}
  .badge{font-size:10px;padding:1px 6px;border-radius:10px;border:1px solid var(--line);color:var(--dim)}
  .badge.ok{color:var(--green);border-color:#1f4429}
  .badge.err{color:var(--red);border-color:#5f1f1f}
  .badge.skill{color:var(--purple);border-color:#3d2a5f}
  .ms{color:var(--dim);font-size:11px;margin-left:auto}
  .tool .body{border-top:1px solid var(--line);padding:9px 11px}
  .kv{color:var(--dim);font-size:11px;margin:6px 0 2px}
  pre{margin:0;padding:9px 11px;background:#0a0e14;border:1px solid var(--line);border-radius:6px;overflow:auto;white-space:pre-wrap;word-break:break-word;max-height:340px}
  /* step / patch */
  .step{color:var(--dim);font-size:11px;padding:3px 11px;border-left:2px solid var(--line)}
  .patch{border:1px dashed var(--line);border-radius:7px;padding:7px 11px;color:var(--cyan);font-size:12px}
  .patch .f{color:var(--fg)}
  .sessionhead{border:1px solid var(--accent);border-radius:8px;padding:11px 13px;background:#0f1d30;margin:6px 0 18px}
  .sessionhead .t{color:var(--accent);font-size:14px;font-weight:bold}
  .sessionhead .m{color:var(--dim);font-size:12px;margin-top:4px}
  .empty{color:var(--dim);padding:40px;text-align:center}
  .err{color:var(--red);padding:16px}
  .hidden{display:none!important}
  mark{background:#5f4b00;color:#fff;border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>🔭 famou-scientist <small>· trace</small></h1>
    <input id="sfilter" type="text" placeholder="筛会话：id / 标题 / 目录…">
    <div id="slist"></div>
  </aside>
  <section id="main">
    <div id="top">
      <input id="sid" type="text" placeholder="粘贴 session_id（支持前缀）后回车 / 点 Load">
      <button id="load">Load</button>
      <button id="refresh" class="ghost">刷新</button>
      <label class="toggle"><input type="checkbox" id="children">含子会话</label>
      <label class="toggle"><input type="checkbox" id="nosteps" checked>隐藏 step</label>
      <select id="kind" class="ghost" style="padding:7px">
        <option value="all">全部</option>
        <option value="tool">仅工具</option>
        <option value="text">仅对话</option>
      </select>
      <input id="find" type="text" placeholder="文本内搜索…" style="flex:0 0 160px;min-width:120px">
    </div>
    <div id="stat"></div>
    <div id="tl"><div class="empty">← 左侧选一个会话，或在上方粘 session_id</div></div>
  </section>
</div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; };
const api = async (p) => { const r = await fetch(p); return r.json(); };

let SESSIONS = [];
let CURRENT = null;     // 当前 payload {main, blocks}
let CUR_SID = "";

// ── 侧栏会话列表 ──
async function loadSessions(){
  const d = await api("/api/sessions?limit=120");
  SESSIONS = d.sessions || [];
  renderSessions();
}
function renderSessions(){
  const f = $("#sfilter").value.toLowerCase();
  const box = $("#slist"); box.textContent = "";
  for(const s of SESSIONS){
    const hay = (s.id+" "+(s.title||"")+" "+(s.directory||"")).toLowerCase();
    if(f && !hay.includes(f)) continue;
    const c = el("div","scard"+(s.id===CUR_SID?" active":""));
    c.appendChild(el("div","id",s.id));
    c.appendChild(el("div","ti",s.title||"(无标题)"));
    const meta = el("div","meta");
    meta.textContent = `${s.messages} msgs · ${s.agent||""} · ${s.updated||""}`;
    if(s.parent_id){ const k=el("span","child"," ↳子"); meta.appendChild(k); }
    c.appendChild(meta);
    c.onclick = () => { $("#sid").value = s.id; loadTrace(s.id); };
    box.appendChild(c);
  }
  if(!box.children.length) box.appendChild(el("div","empty","无匹配会话"));
}

// ── 加载并渲染轨迹 ──
async function loadTrace(sid){
  sid = (sid||"").trim(); if(!sid) return;
  $("#tl").textContent=""; $("#tl").appendChild(el("div","empty","加载中…"));
  const children = $("#children").checked ? 1 : 0;
  const d = await api(`/api/trace?session=${encodeURIComponent(sid)}&children=${children}&steps=1`);
  if(d.error){ $("#tl").textContent=""; $("#tl").appendChild(el("div","err","✗ "+d.error)); return; }
  CURRENT = d; CUR_SID = d.main;
  renderSessions(); // 高亮当前
  render();
}

function statLine(){
  let msgs=0,tools=0,cost=0,model="";
  for(const b of CURRENT.blocks){
    msgs += b.session.messages||0; cost += b.session.cost||0;
    model = model||b.session.model;
    for(const e of b.events) if(e.kind==="tool") tools++;
  }
  const s=$("#stat"); s.style.display="block"; s.textContent="";
  s.appendChild(document.createTextNode("会话 ")); s.appendChild(Object.assign(el("b"),{textContent:CURRENT.blocks.length}));
  s.appendChild(document.createTextNode(" · 消息 ")); s.appendChild(Object.assign(el("b"),{textContent:msgs}));
  s.appendChild(document.createTextNode(" · 工具调用 ")); s.appendChild(Object.assign(el("b"),{textContent:tools}));
  s.appendChild(document.createTextNode(" · model ")); s.appendChild(Object.assign(el("b"),{textContent:model||"?"}));
  s.appendChild(document.createTextNode(" · cost ")); s.appendChild(Object.assign(el("b"),{textContent:(cost||0).toFixed?cost.toFixed(4):cost}));
}

function render(){
  if(!CURRENT) return;
  statLine();
  const noSteps = $("#nosteps").checked;
  const kf = $("#kind").value;
  const find = $("#find").value.toLowerCase();
  const tl = $("#tl"); tl.textContent="";

  for(const b of CURRENT.blocks){
    tl.appendChild(sessionHead(b.session));
    for(const e of b.events){
      if(noSteps && e.kind==="step") continue;
      if(kf==="tool" && e.kind!=="tool") continue;
      if(kf==="text" && e.kind!=="text" && e.kind!=="reasoning") continue;
      if(find){
        const blob = JSON.stringify(e).toLowerCase();
        if(!blob.includes(find)) continue;
      }
      tl.appendChild(renderEvent(e));
    }
  }
  if(!tl.children.length) tl.appendChild(el("div","empty","（无匹配事件）"));
}

function sessionHead(s){
  const w = el("div","sessionhead");
  w.appendChild(el("div","t",(s.parent?"↳ 子会话 · ":"")+(s.title||s.session)));
  const m = el("div","m");
  m.textContent = `${s.session}  ·  ${s.model||"?"}  ·  ${s.messages} msgs  ·  cost ${s.cost||0}  ·  ${s.directory||""}`;
  w.appendChild(m);
  if(s.tokens){
    const t=s.tokens;
    w.appendChild(el("div","m",`tokens: in ${t.input||0} / out ${t.output||0} / reasoning ${t.reasoning||0} / cache ${t.cache_read||0}r ${t.cache_write||0}w`));
  }
  return w;
}

function lead(e, label){
  const role = e.role ? `[${e.role}] ` : "";
  return el("div","lead",`#${e.i}  ${e.t||""}  ${role}${label||""}`);
}

function renderEvent(e){
  const w = el("div","ev "+(e.role||""));
  if(e.kind==="text" || e.kind==="reasoning"){
    w.appendChild(lead(e, e.kind==="reasoning"?"reasoning":""));
    const b = el("div","bubble");
    const tag = el("span","role-tag", (e.role||e.kind)+": ");
    b.appendChild(tag); b.appendChild(document.createTextNode(e.text||""));
    w.appendChild(b);
    return w;
  }
  if(e.kind==="tool"){
    const isSkill = e.tool==="skill" || e.tool==="skills";
    const d = el("details","tool"+(isSkill?" skill":"")); d.open = isSkill;
    const sm = el("summary");
    sm.appendChild(el("span","tname", e.tool||"tool"));
    const st = (e.status||"").toLowerCase();
    sm.appendChild(el("span","badge "+(st==="completed"?"ok":st==="error"?"err":""), e.status||"?"));
    if(isSkill && e.input && e.input.name) sm.appendChild(el("span","badge skill","load: "+e.input.name));
    if(e.call) sm.appendChild(el("span","badge", e.call));
    if(e.ms!=null) sm.appendChild(el("span","ms", e.ms+" ms"));
    d.appendChild(sm);
    const body = el("div","body");
    if(e.error){ body.appendChild(el("div","kv","error")); const p=el("pre"); p.style.color="var(--red)"; p.textContent=fmt(e.error); body.appendChild(p); }
    body.appendChild(el("div","kv","input")); body.appendChild(Object.assign(el("pre"),{textContent:fmt(e.input)}));
    body.appendChild(el("div","kv","output")); body.appendChild(Object.assign(el("pre"),{textContent:fmt(e.output)}));
    d.appendChild(body);
    const lw = el("div","ev"); lw.appendChild(lead(e,"")); lw.appendChild(d); return lw;
  }
  if(e.kind==="step"){
    const tok = e.tokens? `tok in ${e.tokens.input||0}/out ${e.tokens.output||0}`:"";
    w.appendChild(el("div","step",`· step-${e.phase||""}  ${e.reason||""}  ${tok}  cost ${e.cost||0}`));
    return w;
  }
  if(e.kind==="patch"){
    w.appendChild(lead(e,"patch"));
    const p = el("div","patch");
    p.appendChild(document.createTextNode("改动文件: "));
    (e.files||[]).forEach((f,i)=>{ if(i)p.appendChild(document.createTextNode(", ")); p.appendChild(el("span","f",f)); });
    w.appendChild(p); return w;
  }
  // 其它/unknown
  w.appendChild(lead(e, e.kind||"?"));
  w.appendChild(Object.assign(el("pre"),{textContent:fmt(e.data!=null?e.data:e)}));
  return w;
}

function fmt(v){
  if(v==null) return "∅";
  if(typeof v==="string") return v;
  try{ return JSON.stringify(v,null,2); }catch(_){ return String(v); }
}

// ── 事件绑定 ──
$("#sfilter").addEventListener("input", renderSessions);
$("#load").onclick = () => loadTrace($("#sid").value);
$("#sid").addEventListener("keydown", e => { if(e.key==="Enter") loadTrace($("#sid").value); });
$("#refresh").onclick = () => { if(CUR_SID){ loadSessions(); loadTrace(CUR_SID); } else loadSessions(); };
$("#children").addEventListener("change", () => { if(CUR_SID) loadTrace(CUR_SID); });
$("#nosteps").addEventListener("change", render);
$("#kind").addEventListener("change", render);
$("#find").addEventListener("input", render);

(async function boot(){
  await loadSessions();
  const q = new URLSearchParams(location.search);
  const sid = q.get("session") || q.get("sid") || "";
  if(sid){
    $("#sid").value = sid;
    if(q.get("children")==="1" || q.get("children")==="true") $("#children").checked = true;
    await loadTrace(sid);
  }
})();
</script>
</body>
</html>
