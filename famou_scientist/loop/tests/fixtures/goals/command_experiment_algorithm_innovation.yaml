{
  "goal": {
    "id": "command_experiment_algorithm_innovation",
    "name": "command_experiment_algorithm_innovation"
  },
  "experiment_runner": {
    "type": "command",
    "cmd": "python ../experiments/fake_train.py --input {artifact} --output {run_dir}/trained_submission.json",
    "timeout_sec": 30
  },
  "benchmarks": [
    {
      "name": "fake_command_classification_bench",
      "adapter": {
        "type": "command",
        "public_eval_cmd": "python ../evaluators/fake_classification_eval.py --mode public --submission {artifact}",
        "official_eval_cmd": "python ../evaluators/fake_classification_eval.py --mode official --submission {artifact}",
        "timeout_sec": 30
      },
      "official_metric": {
        "name": "accuracy",
        "direction": "higher_is_better"
      },
      "hidden_test_access": "forbidden"
    }
  ],
  "baselines": [
    {"name": "baseline_A", "repo": "baselines/A"}
  ],
  "objective_brief": {
    "primary_goal": "Command experiment runner smoke test.",
    "official_metric": {
      "name": "accuracy",
      "source": "benchmark_adapter",
      "direction": "higher_is_better"
    },
    "preference_description": "Prefer traceable experiment logs and evaluator scores.",
    "allow_examples": ["Run training command before evaluator."],
    "reject_examples": ["Skip evidence logging."],
    "tie_breakers": ["Prefer complete artifact chain."]
  },
  "constraints": {
    "max_wall_time_hours": 1,
    "max_evaluator_submissions": 1,
    "max_parallel_evaluations": 1,
    "max_experiment_retries": 0,
    "hidden_test_access": "forbidden",
    "external_data_policy": "declare_and_approve"
  },
  "outputs": {
    "required": ["method_code", "experiment_report", "evidence_bundle"]
  }
}
