<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<title>配送路线总览</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;background:#F8FAFC;color:#1E293B;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.page-header{padding:16px 16px 0;background:#F8FAFC;flex-shrink:0}
.page-header h1{font-size:18px;font-weight:600;color:#1E293B;margin-bottom:4px}
.page-header .subtitle{font-size:13px;color:#64748B}
.summary-bar{padding:10px 16px;background:#F8FAFC;flex-shrink:0;display:flex;gap:8px;flex-wrap:wrap}
.sc{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:12px 16px;min-width:120px;flex:1}
.sc-label{font-size:12px;color:#64748B;margin-bottom:4px}
.sc-val{font-size:22px;font-weight:600;color:#1E293B}
.sc-val.hi{color:#2563EB}
.layout{display:flex;flex:1;overflow:hidden}
.panel{width:320px;flex-shrink:0;background:#fff;border-right:1px solid #E2E8F0;display:flex;flex-direction:column;overflow:hidden}
.panel-section{padding:10px 12px;border-bottom:1px solid #E2E8F0;font-size:13px;font-weight:600}
.route-list{flex:1;overflow-y:auto;padding:6px}
.route-list::-webkit-scrollbar,.cargo-section::-webkit-scrollbar{width:4px}
.route-list::-webkit-scrollbar-track,.cargo-section::-webkit-scrollbar-track{background:transparent}
.route-list::-webkit-scrollbar-thumb,.cargo-section::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:99px}
.route-list::-webkit-scrollbar-thumb:hover,.cargo-section::-webkit-scrollbar-thumb:hover{background:#94A3B8}
.route-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;border:2px solid transparent;margin-bottom:3px;transition:all .15s}
.route-item:hover{background:#F8FAFC}
.route-item.active{border-color:#2563EB;background:#EFF6FF}
.color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.route-info{flex:1;min-width:0}
.route-title{font-size:13px;font-weight:600}
.route-meta{font-size:11px;color:#64748B;margin-top:2px}
.badge{padding:2px 7px;border-radius:99px;font-size:10px;font-weight:500;color:#fff}
.badge.in_transit{background:#2563EB}
.badge.delivered{background:#16A34A}
.badge.delayed{background:#D97706}
.cargo-section{max-height:220px;overflow-y:auto;padding:0 12px 10px}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:#F8FAFC;padding:5px 6px;text-align:left;border-bottom:1px solid #E2E8F0;color:#64748B;font-weight:500}
td{padding:5px 6px;border-bottom:1px solid #F1F5F9}
.stat-row{display:flex;gap:8px;padding:10px 12px}
.stat-item{flex:1;background:#F8FAFC;border-radius:8px;padding:8px;border:1px solid #E2E8F0}
.stat-label{font-size:10px;color:#64748B}
.stat-val{font-size:13px;font-weight:600;margin-top:2px}
#map-container{flex:1;position:relative}
#map{width:100%;height:100%}
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;padding:18px 28px;box-shadow:0 4px 20px rgba(0,0,0,.15);font-size:13px;color:#64748B;z-index:9999}
</style>
</head>
<body>

<div class="page-header">
  <h1>配送路线总览</h1>
  <p class="subtitle">节点数: 4 · 车辆数: 2 · 坐标系: WGS84→BD09</p>
</div>
<div class="summary-bar" id="summary-cards"></div>

<div class="layout">
  <div class="panel">
    <div class="panel-section">路线列表</div>
    <div class="route-list" id="route-list"></div>
    <div class="panel-section">商品清单 <span id="vlabel" style="color:#64748B;font-weight:400;font-size:12px"></span></div>
    <div class="cargo-section">
      <table>
        <thead><tr><th>SKU</th><th>商品</th><th>数量</th><th>重量</th><th>目的地</th></tr></thead>
        <tbody id="cargo-table"></tbody>
      </table>
    </div>
    <div class="stat-row" id="stat-row"></div>
  </div>
  <div id="map-container">
    <div id="map"></div>
    <div class="loading" id="loading">地图加载中...</div>
  </div>
</div>

<script>
// ── Agent 回调 ──────────────────────────────────────────
function sendToAgent(message, context) {
  window.parent.postMessage(
    { type: 'famou-agent-query', message, context },
    '*'
  );
}
// ────────────────────────────────────────────────────────

// ─────────────── 示例数据（坐标为 WGS84，程序自动转换为 BD09）───────────────
const DATA = {
  nodes: {
    W001: { id:"W001", type:"warehouse", name:"北京仓", lng:116.3912, lat:39.9218, info:{ 库存量:"2400件", 发货批次:"3批" } },
    C001: { id:"C001", type:"customer",  name:"客户A",  lng:116.5422, lat:40.0487, info:{ 收货时间窗:"09:00-12:00", 签收状态:"待收货" } },
    C002: { id:"C002", type:"customer",  name:"客户B",  lng:116.4776, lat:39.7821, info:{ 收货时间窗:"14:00-17:00", 签收状态:"待收货" } },
    C003: { id:"C003", type:"customer",  name:"客户C",  lng:116.6134, lat:39.8956, info:{ 收货时间窗:"10:00-13:00", 签收状态:"待收货" } },
  },
  routes: [
    { id:0, vehicle:"京A-12345", color:"#2563EB", stops:["W001","C001","C002"], status:"in_transit",
      cargo:[
        { sku:"SKU-001", name:"商品A", qty:50, weight_kg:25, dest:"C001" },
        { sku:"SKU-002", name:"商品B", qty:30, weight_kg:15, dest:"C002" },
      ],
      stats:{ total_km:45.2, eta:"11:30", load_rate:"85%" } },
    { id:1, vehicle:"京B-67890", color:"#16A34A", stops:["W001","C003","C001"], status:"delivered",
      cargo:[
        { sku:"SKU-003", name:"商品C", qty:80, weight_kg:40, dest:"C003" },
        { sku:"SKU-004", name:"商品D", qty:20, weight_kg:10, dest:"C001" },
      ],
      stats:{ total_km:38.6, eta:"已完成", load_rate:"92%" } },
  ],
};

// ─────────────── 坐标转换：WGS84 → BD09 ───────────────
// 百度地图使用 BD09 坐标系，GPS 数据为 WGS84，需两步转换：WGS84→GCJ02→BD09
function wgs84ToBd09(lng, lat) {
  // Step1: WGS84 → GCJ02 (火星坐标)
  const a = 6378245.0, ee = 0.00669342162296594323;
  const dLng0 = lng - 105.0, dLat0 = lat - 35.0;
  let dLat = -100.0 + 2.0*dLng0 + 3.0*dLat0 + 0.2*dLat0*dLat0 + 0.1*dLng0*dLat0 + 0.2*Math.sqrt(Math.abs(dLng0));
  dLat += (20.0*Math.sin(6.0*dLng0*Math.PI) + 20.0*Math.sin(2.0*dLng0*Math.PI)) * 2.0/3.0;
  dLat += (20.0*Math.sin(dLat0*Math.PI) + 40.0*Math.sin(dLat0/3.0*Math.PI)) * 2.0/3.0;
  dLat += (160.0*Math.sin(dLat0/12.0*Math.PI) + 320.0*Math.sin(dLat0*Math.PI/30.0)) * 2.0/3.0;
  let dLng = 300.0 + dLng0 + 2.0*dLat0 + 0.1*dLng0*dLng0 + 0.1*dLng0*dLat0 + 0.1*Math.sqrt(Math.abs(dLng0));
  dLng += (20.0*Math.sin(6.0*dLng0*Math.PI) + 20.0*Math.sin(2.0*dLng0*Math.PI)) * 2.0/3.0;
  dLng += (20.0*Math.sin(dLng0*Math.PI) + 40.0*Math.sin(dLng0/3.0*Math.PI)) * 2.0/3.0;
  dLng += (150.0*Math.sin(dLng0/12.0*Math.PI) + 300.0*Math.sin(dLng0/30.0*Math.PI)) * 2.0/3.0;
  const radLat = lat / 180.0 * Math.PI;
  let magic = Math.sin(radLat);
  magic = 1 - ee * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  const gcjLat = lat  + (dLat * 180.0) / ((a * (1-ee)) / (magic*sqrtMagic) * Math.PI);
  const gcjLng = lng + (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);

  // Step2: GCJ02 → BD09
  const x_pi = Math.PI * 3000.0 / 180.0;
  const z = Math.sqrt(gcjLng*gcjLng + gcjLat*gcjLat) + 0.00002*Math.sin(gcjLat*x_pi);
  const theta = Math.atan2(gcjLat, gcjLng) + 0.000003*Math.cos(gcjLng*x_pi);
  return { lng: z*Math.cos(theta)+0.0065, lat: z*Math.sin(theta)+0.006 };
}

// 批量转换节点坐标（预计算，避免重复转换）
const nodesBD09 = {};
Object.values(DATA.nodes).forEach(n => { nodesBD09[n.id] = wgs84ToBd09(n.lng, n.lat); });

// ─────────────── 地图初始化 ───────────────
let map, activeIdx = -1;
const polylines = {}; // routeId → BMapGL.Polyline

window._bmap_init = function() {
  document.getElementById('loading').style.display = 'none';
  map = new BMapGL.Map('map');
  const depot = nodesBD09['W001'];
  map.centerAndZoom(new BMapGL.Point(depot.lng, depot.lat), 12);
  map.enableScrollWheelZoom(true);
  map.setMapType(BMAP_NORMAL_MAP);
  map.addControl(new BMapGL.NavigationControl());
  map.addControl(new BMapGL.ScaleControl());

  // 绘制仓库标记
  addNodeMarker('W001');
  // 绘制客户节点
  Object.keys(DATA.nodes).filter(id => DATA.nodes[id].type === 'customer').forEach(addNodeMarker);

  // 绘制所有路线（点之间直线连接）
  DATA.routes.forEach((r, i) => drawRoute(r, i, 1.0));

  buildRouteList();
  buildSummaryCards();
};

function addNodeMarker(id) {
  const n = DATA.nodes[id];
  const bd = nodesBD09[id];
  const pt = new BMapGL.Point(bd.lng, bd.lat);
  const isWarehouse = n.type === 'warehouse';
  const svgStr = isWarehouse
    ? `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="32" viewBox="0 0 28 32"><polygon points="14,2 26,8 26,20 14,26 2,20 2,8" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="14" y="18" text-anchor="middle" fill="white" font-size="9" font-family="sans-serif">仓</text></svg>`
    : `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><circle cx="7" cy="7" r="6" fill="#64748B" stroke="white" stroke-width="1.5"/></svg>`;
  const sz = isWarehouse ? new BMapGL.Size(28,32) : new BMapGL.Size(14,14);
  const anchor = isWarehouse ? new BMapGL.Size(14,16) : new BMapGL.Size(7,7);
  const icon = new BMapGL.Icon('data:image/svg+xml;utf8,'+encodeURIComponent(svgStr), sz, {anchor});
  const mk = new BMapGL.Marker(pt, {icon});
  if (isWarehouse) mk.setLabel(new BMapGL.Label(n.name, {offset: new BMapGL.Size(16,-6)}));
  const iw = new BMapGL.InfoWindow(`<div style="font-size:12px;line-height:1.8"><b>${n.name}</b><br>${Object.entries(n.info).map(([k,v])=>`${k}: ${v}`).join('<br>')}</div>`, {width:180});
  mk.addEventListener('click', () => map.openInfoWindow(iw, pt));
  map.addOverlay(mk);
}

// ─── 路线绘制（点之间直线连接）───
function drawRoute(r, idx, opacity) {
  const pts = r.stops.map(id => {
    const bd = nodesBD09[id];
    return new BMapGL.Point(bd.lng, bd.lat);
  });
  const pl = new BMapGL.Polyline(pts, {
    strokeColor: r.color,
    strokeWeight: 3,
    strokeOpacity: opacity * 0.85,
  });
  map.addOverlay(pl);
  polylines[idx] = pl;
}

function setRouteOpacity(i, active) {
  const pl = polylines[i];
  if (!pl) return;
  pl.setStrokeWeight(active ? 5 : 2.5);
  pl.setStrokeOpacity(active ? 1 : 0.3);
}

function selectRoute(i) {
  activeIdx = i;
  DATA.routes.forEach((_, j) => setRouteOpacity(j, j === i));
  renderCargoPanel(i);
  document.querySelectorAll('.route-item').forEach((el, j) => el.classList.toggle('active', j === i));
  // 定位到该路线
  const r = DATA.routes[i];
  const pts = r.stops.map(id => { const bd = nodesBD09[id]; return new BMapGL.Point(bd.lng, bd.lat); });
  const vp = map.getViewport(pts);
  map.centerAndZoom(vp.center, vp.zoom - 1);
}

function renderCargoPanel(i) {
  const r = DATA.routes[i];
  document.getElementById('vlabel').textContent = `— ${r.vehicle}`;
  document.getElementById('cargo-table').innerHTML = r.cargo
    .map(c => `<tr><td>${c.sku}</td><td>${c.name}</td><td>${c.qty}</td><td>${c.weight_kg}kg</td><td>${c.dest}</td></tr>`)
    .join('');
  document.getElementById('stat-row').innerHTML = `
    <div class="stat-item"><div class="stat-label">总里程</div><div class="stat-val">${r.stats.total_km}km</div></div>
    <div class="stat-item"><div class="stat-label">ETA</div><div class="stat-val">${r.stats.eta}</div></div>
    <div class="stat-item"><div class="stat-label">装载率</div><div class="stat-val">${r.stats.load_rate}</div></div>`;
}

function buildRouteList() {
  const listEl = document.getElementById('route-list');
  const statusLabel = { in_transit:'在途', delivered:'已达', delayed:'延误' };
  DATA.routes.forEach((r, i) => {
    const el = document.createElement('div');
    el.className = 'route-item' + (i === 0 ? ' active' : '');
    el.innerHTML = `
      <div class="color-dot" style="background:${r.color}"></div>
      <div class="route-info">
        <div class="route-title">${r.vehicle}</div>
        <div class="route-meta">${r.stops.length-1} 站 · ${r.cargo.length} 件 · ${r.stats.total_km}km</div>
      </div>
      <span class="badge ${r.status}">${statusLabel[r.status]}</span>`;
    el.onclick = () => { selectRoute(i); askRouteAgent(i); };
    listEl.appendChild(el);
  });
  renderCargoPanel(0);
}

function askRouteAgent(i) {
  const r = DATA.routes[i];
  const stopNames = r.stops.map(id => DATA.nodes[id]?.name || id).join(' → ');
  const statusLabel = { in_transit:'在途中', delivered:'已送达', delayed:'延误' };
  sendToAgent(
    `车辆 ${r.vehicle} 路线：${stopNames}，状态：${statusLabel[r.status] || r.status}，总里程 ${r.stats.total_km}km，ETA ${r.stats.eta}，装载率 ${r.stats.load_rate}。请分析该路线或提出优化建议。`,
    { vehicle: r.vehicle, stops: r.stops, status: r.status, stats: r.stats, cargo: r.cargo }
  );
}

function buildSummaryCards() {
  const totalKm = DATA.routes.reduce((s,r)=>s+r.stats.total_km,0).toFixed(1);
  const totalCargo = DATA.routes.reduce((s,r)=>s+r.cargo.reduce((a,c)=>a+c.qty,0),0);
  document.getElementById('summary-cards').innerHTML = `
    <div class="sc"><div class="sc-label">路线数</div><div class="sc-val hi">${DATA.routes.length}</div></div>
    <div class="sc"><div class="sc-label">总里程</div><div class="sc-val">${totalKm} km</div></div>
    <div class="sc"><div class="sc-label">总商品数</div><div class="sc-val">${totalCargo} 件</div></div>
    <div class="sc"><div class="sc-label">节点数</div><div class="sc-val">${Object.keys(DATA.nodes).length}</div></div>`;
}
</script>
<!-- 百度地图 GL SDK，AK 已内嵌，直接使用 -->
<script src="https://api.map.baidu.com/api?v=1.0&type=webgl&ak=OyLmGLaGzgonCw3i6sgfe3ebGX1ixhLl&callback=_bmap_init"></script>
</body>
</html>
